name: sherpa-onnx

# Builds Upshot's sherpa-onnx wheel for Windows without text-to-speech, so without eSpeak NG
# (packaging/sherpa-onnx/build.sh, ClickUp z8tj1hpjbu) and, when a release tag is given, publishes
# it with its licence texts and the sources it was built from, as a pre-release that the build
# pins by URL and SHA-256. Published by hand only; a pull request that changes the build builds
# it, so the change is proven before it merges, and publishes nothing.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to publish, e.g. sherpa-onnx-1.13.6-upshot-1 (empty: build only)"
        required: false
        default: ""
  pull_request:
    paths: [packaging/sherpa-onnx/**, .github/workflows/sherpa-onnx.yml]

permissions: {}

# A newer push to the same pull request replaces its running build; a manual run is never
# cancelled.
concurrency:
  group: sherpa-onnx-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The build runs third-party code (CMake, MSVC, the sources and what they download), so it holds
  # no write token: read-only contents, and no credentials left in the checkout.
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: mkdir -p "$RUNNER_TEMP/sherpa" && bash packaging/sherpa-onnx/build.sh "$RUNNER_TEMP/sherpa"
      - uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-wheel
          path: |
            ${{ runner.temp }}/sherpa/dist/*.whl
            ${{ runner.temp }}/sherpa/dist/*.txt
            ${{ runner.temp }}/sherpa/dist/sherpa-onnx-sources.zip
            ${{ runner.temp }}/sherpa/dist/SHA256SUMS

  publish:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.release != ''
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sherpa-onnx-wheel
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          [[ "$RELEASE" =~ ^sherpa-onnx-[0-9]+\.[0-9]+\.[0-9]+-upshot-[0-9]+$ ]] \
            || { echo "bad tag: $RELEASE"; exit 1; }
          cd dist && sha256sum -c SHA256SUMS
          gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "$RELEASE (Upshot's sherpa-onnx wheel without text-to-speech)" \
            --notes-file BUILD.txt \
            sherpa_onnx-*.whl LICENSE-sherpa-onnx.txt LICENSE-onnxruntime.txt \
            LICENSE-third-party.txt BUILD.txt imports.txt downloads.txt SHA256SUMS \
            sherpa-onnx-sources.zip
