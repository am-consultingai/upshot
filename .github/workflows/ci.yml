name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q -m "not windows and not audio_hw and not gpu and not live_api"
      - run: uv run python -m app.selftest all --report selftest-linux.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-linux
          path: selftest-linux.json

  windows:
    runs-on: windows-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest -q -m "not audio_hw and not gpu and not live_api"
      - run: uv run python -m app.selftest all --report selftest-windows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-windows
          path: selftest-windows.json
