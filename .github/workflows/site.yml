name: site

# The website's own checks, in about a minute, for a pull request that changes it. The full
# suite (ci.yml) skips a change that touches only the website.
on:
  pull_request:
    paths:
      - "site/**"
      - "tests/unit/test_site.py"
      - ".github/workflows/pages.yml"
      - ".github/workflows/site.yml"

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run pytest -q tests/unit/test_site.py
      - run: node --check site/site.js
