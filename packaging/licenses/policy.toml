# Which licences Upshot may ship, checked by scripts/licence_gate.py in every CI job and by
# the build. Licence names are SPDX identifiers as scripts/third_party_notices.py writes
# them; an "A OR B" passes when either side does, "A AND B" when both do.

# Permissive: ship with the notice and the licence text (the notices file carries both).
# Only licences a component uses today; another is added when one needs it, deliberately.
allowed = [
  "MIT", "MIT-0", "MIT-CMU", "ISC", "0BSD", "BSD-2-Clause", "BSD-3-Clause", "Apache-2.0",
  "PSF-2.0", "Zlib", "CC0-1.0", "BSL-1.0", "Apache-2.0 WITH LLVM-exception",
]

# Copyleft that Upshot may ship only as it does for these components: unmodified,
# replaceable (a separate program, extension or loose .py files) and with its source
# offered. Anything else under these licences fails until it is added here, deliberately.
[conditional]
# FFmpeg's licence is read from its configure line: Upshot's audio-only build is LGPL-2.1-or-
# later; a build with --enable-version3 reads LGPL-3.0-or-later and fails until listed there.
"LGPL-2.1-or-later" = ["soxr", "FFmpeg (Upshot's audio-only build)"]
"LGPL-3.0-or-later" = ["pystray"]
"MPL-2.0" = ["certifi", "tqdm"]
"OFL-1.1" = ["Frank Ruhl Libre and IBM Plex Sans Hebrew fonts"]

# Not open-source licences, or open-source ones with an exception; each approved by name.
[[exception]]
name = "PyInstaller bootloader"
licence = "GPL-2.0-or-later WITH Bootloader-exception"
why = "The exception allows the bootloader to start a program under any licence."
approved = "D84 (licence epic S4)"

[[exception]]
name = "Microsoft Visual C++ and Universal C runtime"
licence = "LicenseRef-Microsoft-Redist"
why = "Microsoft's redistributable runtime, under the Visual Studio redistribution terms."
approved = "licence epic S4"

[[exception]]
name = "NVIDIA cuBLAS (nvidia-cublas-cu12)"
licence = "LicenseRef-NVIDIA-CUDA-EULA"
why = "Downloaded from PyPI on GPU machines, not shipped; NVIDIA's terms kept beside it."
approved = "licence epic S2 (PR #43); NVIDIA's terms shown before the download in S9"

[[exception]]
name = "NVIDIA CUDA runtime (statically linked inside ctranslate2)"
licence = "LicenseRef-NVIDIA-CUDA-EULA"
why = "Distributable (CUDA licence, Attachment A). §2.1 (for use in systems with NVIDIA GPUs) is read as met: Upshot uses CUDA only when an NVIDIA GPU is present; elsewhere it is never initialised, as with PyPI's CUDA wheels."
approved = "D100, licence epic S12 (product owner, 2026-10-17; a CPU-only build is the fallback, ClickUp)"
