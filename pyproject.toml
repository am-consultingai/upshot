[project]
name = "upshot"
version = "0.1.0"
description = "Local Windows meeting recorder, transcriber and summarizer"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "python-multipart>=0.0.20",
    "anthropic>=0.69",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "rapidfuzz>=3.10",
    "numpy>=2.1",
    "soxr>=0.5",
    "psutil>=6.1",
    "apscheduler>=3.11",
    "keyring>=25.5",
    "pyyaml>=6.0",
    "pillow>=11.0",
    "faster-whisper>=1.1",
    "onnxruntime>=1.20",
    "pystray>=0.19; sys_platform == 'win32'",
    "pyaudiowpatch>=0.2.12.7; sys_platform == 'win32'",
    "pywin32>=308; sys_platform == 'win32'",
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "windows-toasts>=1.3; sys_platform == 'win32'",
    "mcp>=1.20",
]

[project.scripts]
upshot = "app.tray:main"

[project.optional-dependencies]
# Speaker diarization. Opt-in: the default install stays small, and this pulls a second
# native runtime. ONNX rather than pyannote/torch — DECISIONS.md D28.
# sherpa-onnx-core is listed explicitly: it is a runtime dependency of
# sherpa-onnx that resolvers do not always pull in, and without it the
# import fails on a missing libonnxruntime.
diarization = ["sherpa-onnx>=1.13", "sherpa-onnx-core>=1.13"]
# Alternative summarization providers. Anthropic ships in the base install; these are
# opt-in so the default installer stays small.
openai = ["openai>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "aiosmtpd>=1.4",
    "beautifulsoup4>=4.12",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "types-jsonschema",
    "pyinstaller>=6.11; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["frontend", ".venv", "build", "dist", "docs", "*.md"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app"]
plugins = []

[[tool.mypy.overrides]]
module = [
    "soxr.*", "pystray.*", "pyaudiowpatch.*", "pyaudio.*",
    "pycaw.*", "comtypes.*", "win32api.*", "win32con.*", "win32gui.*",
    "win32event.*", "winreg.*", "windows_toasts.*", "faster_whisper.*",
    "apscheduler.*", "keyring.*", "psutil.*", "PIL.*", "rapidfuzz.*",
    "bs4.*", "aiosmtpd.*", "win32com.*", "pythoncom.*", "win32file.*",
    "ctranslate2.*", "huggingface_hub.*", "jsonschema.*", "openai.*",
    "winerror.*", "win32event.*", "pystray.*", "sherpa_onnx.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live_api' --strict-markers"
markers = [
    "windows: requires a real Windows host",
    "audio_hw: requires real audio hardware",
    "gpu: requires a CUDA GPU",
    "live_api: makes a real Anthropic API call",
    "slow: takes more than a few seconds",
]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
