[project]
name = "upshot"
version = "0.1.0"
description = "Local Windows meeting recorder, transcriber and summarizer"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "python-multipart>=0.0.20",
    "anthropic>=0.69",
    "httpx>=0.28",
    # Updates (D87): the manifest's Ed25519 signature, and comparing versions. Both were
    # already installed through other packages; the app now uses them itself.
    "cryptography>=44",
    "packaging>=24",
    "jsonschema>=4.23",
    "rapidfuzz>=3.10",
    "numpy>=2.1",
    "soxr>=0.5",
    "psutil>=6.1",
    "apscheduler>=3.11",
    "keyring>=25.5",
    "pyyaml>=6.0",
    "pillow>=11.0",
    "faster-whisper>=1.1",
    # Pinned, and on Windows taken from Upshot's own build (below), not PyPI's.
    "ctranslate2==4.8.1",
    "onnxruntime>=1.20",
    # Speaker diarization, always on (DECISIONS.md D85): ONNX rather than pyannote/torch
    # (D28). On Windows, Upshot's own sherpa-onnx without text-to-speech ([tool.uv.sources]),
    # which carries onnxruntime.dll itself. Elsewhere PyPI's, which needs sherpa-onnx-core
    # (resolvers do not always pull it in; without it the import fails on a missing
    # libonnxruntime). On Windows sherpa-onnx-core must never come in: its C API library is
    # built with text-to-speech, so with eSpeak NG (GPL).
    "sherpa-onnx>=1.13",
    "sherpa-onnx-core>=1.13; sys_platform != 'win32'",
    "pystray>=0.19; sys_platform == 'win32'",
    "pyaudiowpatch>=0.2.12.7; sys_platform == 'win32'",
    "pywin32>=308; sys_platform == 'win32'",
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "windows-toasts>=1.3; sys_platform == 'win32'",
    "mcp>=1.20",
    # The summary is model-written HTML shown in the app: an allowlist cleans it
    # (app/pipeline/stages/render.py).
    "nh3>=0.3.7",
]

[project.scripts]
upshot = "app.tray:main"

[project.optional-dependencies]
# Alternative summarization providers. Anthropic ships in the base install; these are
# opt-in so the default installer stays small.
openai = ["openai>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "aiosmtpd>=1.4",
    "beautifulsoup4>=4.12",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "types-jsonschema",
    "pyinstaller>=6.11; sys_platform == 'win32'",
]

[tool.uv]
# PyAV, which faster-whisper requires, is never installed: its Windows wheel bundles the
# GPL encoders libx264 and libx265, which Upshot may not ship. faster-whisper is given
# arrays instead of paths (app/asr/wav.py), and app/__init__.py stands in for the import.
override-dependencies = ["av; sys_platform == 'never'"]

# ctranslate2 on Windows: Upshot's own wheel (packaging/ctranslate2/build.sh, published by
# .github/workflows/ctranslate2.yml), built without Intel's OpenMP runtime and oneMKL, whose
# licences Upshot does not take on (licence epic S12, D100). Same speed and accuracy; the CPU
# path is oneDNN, as AMD CPUs already run. Elsewhere (CI on Linux) PyPI's wheel, never shipped.
# The wheel is for Python 3.13, which the installer is built with; on another Windows Python
# PyPI's wheel would come back, with Intel's runtime, and scripts/check_dist.py refuses that build.
#
# sherpa-onnx on Windows: Upshot's own wheel (packaging/sherpa-onnx/build.sh, published by
# .github/workflows/sherpa-onnx.yml), built without text-to-speech, because PyPI's links eSpeak NG
# (GPL-3.0-or-later) and piper-phonemize into the module diarization imports (ClickUp z8tj1hpjbu).
# Same diarization, speaker turn for turn, at the same speed. Python 3.13 only, as ctranslate2;
# PyPI's wheel on another Python is refused by scripts/check_dist.py.
[tool.uv.sources]
sherpa-onnx = [
  { url = "https://github.com/am-consultingai/upshot/releases/download/sherpa-onnx-1.13.6-upshot-1/sherpa_onnx-1.13.6-cp313-cp313-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.13'" },
]
ctranslate2 = [
  { url = "https://github.com/am-consultingai/upshot/releases/download/ctranslate2-4.8.1-upshot-1/ctranslate2-4.8.1-cp313-cp313-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.13'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["frontend", ".venv", "build", "dist", "docs", "*.md"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app"]
plugins = []

[[tool.mypy.overrides]]
module = [
    "soxr.*", "pystray.*", "pyaudiowpatch.*", "pyaudio.*",
    "pycaw.*", "comtypes.*", "win32api.*", "win32con.*", "win32gui.*",
    "win32event.*", "winreg.*", "windows_toasts.*", "faster_whisper.*",
    "apscheduler.*", "keyring.*", "psutil.*", "PIL.*", "rapidfuzz.*",
    "bs4.*", "aiosmtpd.*", "win32com.*", "pythoncom.*", "win32file.*",
    "ctranslate2.*", "huggingface_hub.*", "jsonschema.*", "openai.*",
    "winerror.*", "win32event.*", "win32ui.*", "pystray.*", "sherpa_onnx.*",
    "win32process.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live_api and not gpu' --strict-markers"
markers = [
    "windows: requires a real Windows host",
    "audio_hw: requires real audio hardware",
    "gpu: loads a real speech model (GPU or CPU); excluded by default, run with -m gpu",
    "live_api: makes a real Anthropic API call",
    "slow: takes more than a few seconds",
]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
